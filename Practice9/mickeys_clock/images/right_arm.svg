<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g id="right-arm">
    <!-- Black sleeve from center pointing right -->
    <rect x="248" y="244" width="82" height="14" rx="4" fill="#1a1a1a"/>

    <!-- White cuff at wrist -->
    <rect x="326" y="236" width="12" height="30" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

    <!-- White palm -->
    <path d="M 338 236
             Q 354 230, 368 236
             Q 382 230, 392 238
             Q 402 234, 404 250
             Q 404 264, 392 270
             Q 372 274, 352 270
             Q 340 270, 338 262 Z"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

    <!-- Thumb -->
    <path d="M 354 234
             Q 358 222, 370 224
             Q 378 228, 374 238 Z"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

    <!-- 3 dart lines -->
    <path d="M 356 250 Q 356 260 354 268" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 370 250 Q 370 260 368 268" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 384 250 Q 384 260 382 268" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
