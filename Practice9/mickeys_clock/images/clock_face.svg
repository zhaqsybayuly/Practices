<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Chrome bezel -->
    <radialGradient id="bezel" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#e0e0e0"/>
      <stop offset="95%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#555555"/>
    </radialGradient>

    <!-- Warm cream face background -->
    <radialGradient id="face-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff9e3"/>
      <stop offset="85%" stop-color="#f4e7b0"/>
      <stop offset="100%" stop-color="#e9d690"/>
    </radialGradient>

    <filter id="inner-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.25"/>
    </filter>

    <!-- Single sun ray -->
    <path id="ray" d="M 250 250 L 244 38 L 256 38 Z" fill="#ead48a" opacity="0.55"/>

    <!-- Tick marks -->
    <line id="min-tick" x1="250" y1="40" x2="250" y2="52" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round"/>
    <line id="hour-tick" x1="250" y1="36" x2="250" y2="56" stroke="#c41f26" stroke-width="4" stroke-linecap="round"/>

    <style>
      .num {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 42px;
        font-weight: 700;
        fill: #2a2a2a;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Metallic outer ring -->
  <circle cx="250" cy="250" r="248" fill="url(#bezel)"/>
  <circle cx="250" cy="250" r="238" fill="#ededed"/>
  <circle cx="250" cy="250" r="232" fill="#8a8a8a"/>

  <!-- Inner face -->
  <circle cx="250" cy="250" r="228" fill="url(#face-bg)" filter="url(#inner-shadow)"/>

  <!-- Sun rays (24 rays, every 15 degrees) -->
  <g>
    <use href="#ray" transform="rotate(0, 250, 250)"/>
    <use href="#ray" transform="rotate(15, 250, 250)"/>
    <use href="#ray" transform="rotate(30, 250, 250)"/>
    <use href="#ray" transform="rotate(45, 250, 250)"/>
    <use href="#ray" transform="rotate(60, 250, 250)"/>
    <use href="#ray" transform="rotate(75, 250, 250)"/>
    <use href="#ray" transform="rotate(90, 250, 250)"/>
    <use href="#ray" transform="rotate(105, 250, 250)"/>
    <use href="#ray" transform="rotate(120, 250, 250)"/>
    <use href="#ray" transform="rotate(135, 250, 250)"/>
    <use href="#ray" transform="rotate(150, 250, 250)"/>
    <use href="#ray" transform="rotate(165, 250, 250)"/>
    <use href="#ray" transform="rotate(180, 250, 250)"/>
    <use href="#ray" transform="rotate(195, 250, 250)"/>
    <use href="#ray" transform="rotate(210, 250, 250)"/>
    <use href="#ray" transform="rotate(225, 250, 250)"/>
    <use href="#ray" transform="rotate(240, 250, 250)"/>
    <use href="#ray" transform="rotate(255, 250, 250)"/>
    <use href="#ray" transform="rotate(270, 250, 250)"/>
    <use href="#ray" transform="rotate(285, 250, 250)"/>
    <use href="#ray" transform="rotate(300, 250, 250)"/>
    <use href="#ray" transform="rotate(315, 250, 250)"/>
    <use href="#ray" transform="rotate(330, 250, 250)"/>
    <use href="#ray" transform="rotate(345, 250, 250)"/>
  </g>

  <!-- Soft inner overlay to fade rays near the center -->
  <circle cx="250" cy="250" r="130" fill="#fdf5dc" opacity="0.55"/>

  <!-- Hour + minute ticks -->
  <g>
    <use href="#hour-tick" transform="rotate(0, 250, 250)"/>
    <use href="#min-tick" transform="rotate(6, 250, 250)"/>
    <use href="#min-tick" transform="rotate(12, 250, 250)"/>
    <use href="#min-tick" transform="rotate(18, 250, 250)"/>
    <use href="#min-tick" transform="rotate(24, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(30, 250, 250)"/>
    <use href="#min-tick" transform="rotate(36, 250, 250)"/>
    <use href="#min-tick" transform="rotate(42, 250, 250)"/>
    <use href="#min-tick" transform="rotate(48, 250, 250)"/>
    <use href="#min-tick" transform="rotate(54, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(60, 250, 250)"/>
    <use href="#min-tick" transform="rotate(66, 250, 250)"/>
    <use href="#min-tick" transform="rotate(72, 250, 250)"/>
    <use href="#min-tick" transform="rotate(78, 250, 250)"/>
    <use href="#min-tick" transform="rotate(84, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(90, 250, 250)"/>
    <use href="#min-tick" transform="rotate(96, 250, 250)"/>
    <use href="#min-tick" transform="rotate(102, 250, 250)"/>
    <use href="#min-tick" transform="rotate(108, 250, 250)"/>
    <use href="#min-tick" transform="rotate(114, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(120, 250, 250)"/>
    <use href="#min-tick" transform="rotate(126, 250, 250)"/>
    <use href="#min-tick" transform="rotate(132, 250, 250)"/>
    <use href="#min-tick" transform="rotate(138, 250, 250)"/>
    <use href="#min-tick" transform="rotate(144, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(150, 250, 250)"/>
    <use href="#min-tick" transform="rotate(156, 250, 250)"/>
    <use href="#min-tick" transform="rotate(162, 250, 250)"/>
    <use href="#min-tick" transform="rotate(168, 250, 250)"/>
    <use href="#min-tick" transform="rotate(174, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(180, 250, 250)"/>
    <use href="#min-tick" transform="rotate(186, 250, 250)"/>
    <use href="#min-tick" transform="rotate(192, 250, 250)"/>
    <use href="#min-tick" transform="rotate(198, 250, 250)"/>
    <use href="#min-tick" transform="rotate(204, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(210, 250, 250)"/>
    <use href="#min-tick" transform="rotate(216, 250, 250)"/>
    <use href="#min-tick" transform="rotate(222, 250, 250)"/>
    <use href="#min-tick" transform="rotate(228, 250, 250)"/>
    <use href="#min-tick" transform="rotate(234, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(240, 250, 250)"/>
    <use href="#min-tick" transform="rotate(246, 250, 250)"/>
    <use href="#min-tick" transform="rotate(252, 250, 250)"/>
    <use href="#min-tick" transform="rotate(258, 250, 250)"/>
    <use href="#min-tick" transform="rotate(264, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(270, 250, 250)"/>
    <use href="#min-tick" transform="rotate(276, 250, 250)"/>
    <use href="#min-tick" transform="rotate(282, 250, 250)"/>
    <use href="#min-tick" transform="rotate(288, 250, 250)"/>
    <use href="#min-tick" transform="rotate(294, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(300, 250, 250)"/>
    <use href="#min-tick" transform="rotate(306, 250, 250)"/>
    <use href="#min-tick" transform="rotate(312, 250, 250)"/>
    <use href="#min-tick" transform="rotate(318, 250, 250)"/>
    <use href="#min-tick" transform="rotate(324, 250, 250)"/>
    <use href="#hour-tick" transform="rotate(330, 250, 250)"/>
    <use href="#min-tick" transform="rotate(336, 250, 250)"/>
    <use href="#min-tick" transform="rotate(342, 250, 250)"/>
    <use href="#min-tick" transform="rotate(348, 250, 250)"/>
    <use href="#min-tick" transform="rotate(354, 250, 250)"/>
  </g>

  <!-- Numbers at radius ~185 -->
  <g>
    <text x="250" y="78" class="num">12</text>
    <text x="343" y="103" class="num">1</text>
    <text x="410" y="170" class="num">2</text>
    <text x="435" y="250" class="num">3</text>
    <text x="410" y="330" class="num">4</text>
    <text x="343" y="397" class="num">5</text>
    <text x="250" y="422" class="num">6</text>
    <text x="157" y="397" class="num">7</text>
    <text x="90" y="330" class="num">8</text>
    <text x="65" y="250" class="num">9</text>
    <text x="90" y="170" class="num">10</text>
    <text x="157" y="103" class="num">11</text>
  </g>
</svg>
